name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # sqflite_common_ffi (usado en test/data/database_helper_test.dart)
      # necesita una libsqlite3 real en la máquina que corre los tests.
      # No se asume que el runner ya la traiga: se instala explícitamente,
      # tanto la librería de runtime como los headers de desarrollo.
      - name: Instalar libsqlite3
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: 'stable'
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: flutter analyze
        run: flutter analyze

      - name: flutter test
        run: flutter test
