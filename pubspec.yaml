name: pet_pal
description: "Aplicación de cuidado de mascotas PetPal"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  uuid: ^4.3.3
  image_picker: ^1.0.7
  sqflite: ^2.3.3+1
  path_provider: ^2.1.5
  pdf: ^3.10.6
  share_plus: ^7.0.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1
  rxdart: ^0.28.0
  file_picker: ^10.2.4
  path: ^1.9.0
  table_calendar: ^3.1.3
  archive: ^3.6.1
  pro_image_editor: ^12.0.0
  flutter_image_compress: ^2.4.0
  app_settings: ^5.1.1
  open_filex: ^4.5.0
  fl_chart: ^0.69.0
  flutter_riverpod: ^2.6.1
  csv: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: "^0.13.1"
  sqflite_common_ffi: ^2.3.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png