name: pet_pal
description: "Aplicación de cuidado de mascotas PetPal"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  intl: ^0.19.0
  uuid: ^4.3.3
  image_picker: ^1.0.7
  sqflite: ^2.3.3+1
  path_provider: ^2.1.5
  pdf: ^3.10.6
  share_plus: ^7.0.2
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.0
  flutter_timezone: ^4.1.1
  rxdart: ^0.28.0
  file_picker: ^10.2.4
  path: ^1.9.0
  table_calendar: ^3.1.3
  archive: ^3.6.1
  pro_image_editor: ^12.0.0
  flutter_image_compress: ^2.4.0
  app_settings: ^5.1.1
  open_filex: ^4.5.0
  fl_chart: ^0.69.0
  flutter_riverpod: ^2.6.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.5.5
  local_auth: ^2.3.0
  home_widget: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: 0.14.4
  sqflite_common_ffi: ^2.3.4
  path_provider_platform_interface: ^2.1.1
  share_plus_platform_interface: ^3.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  min_sdk_android: 21
  image_path: "assets/icon/petpal_icon_1024.png"
  adaptive_icon_background: "assets/icon/petpal_background_1024.png"
  adaptive_icon_foreground: "assets/icon/petpal_foreground_1024.png"
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/icon/petpal_monochrome_1024.png"

flutter:
  uses-material-design: true